services:
  - type: web
    name: voice-battle-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set to the Vercel site URL, e.g. https://voice-battle.vercel.app
      - key: CLIENT_ORIGIN
        sync: false
